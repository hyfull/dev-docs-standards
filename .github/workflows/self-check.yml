name: 规范仓库检查

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 测试文档检查器
        run: python -m unittest discover -s tests
      - name: 测试项目模板
        run: |
          python -m pip install copier==9.18.2
          copier copy --vcs-ref HEAD --defaults -d project_name=Smoke . "${{ runner.temp }}/docs-smoke"
          python scripts/check_docs.py --root "${{ runner.temp }}/docs-smoke"
